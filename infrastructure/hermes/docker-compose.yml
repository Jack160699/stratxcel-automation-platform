# Local, free Hermes Agent development environment. No paid hosting — this
# is meant for a developer's machine, NOT the shared production t3.small
# (see MANUAL_SETUP_REQUIRED.md M11 for why: Hermes Agent's own documented
# minimum is 2GB RAM / 10GB disk on top of whatever else is on the box, and
# the production host already runs four Node processes on ~2GB total).
#
# This targets the REAL upstream engine — NousResearch/hermes-agent's
# official Docker image and its documented `gateway run` API-server mode
# (verified against https://hermes-agent.nousresearch.com/docs/user-guide/docker
# and Docker Hub `nousresearch/hermes-agent`, 2026-08-09) — replacing the
# placeholder ${HERMES_IMAGE} this file used to reference before that engine
# had been identified and verified. Still not run in this session (Docker
# unavailable here); statically written against the documented `docker run`
# example, not verified by an actual `docker compose up`.
#
# packages/hermes/src/http-adapter.ts talks to this over HERMES_GATEWAY_URL
# (this container's base URL) using a bearer token (HERMES_API_KEY here,
# API_SERVER_KEY on the Hermes side) — NOT the HMAC signature scheme this
# file used to describe; the real server only checks Authorization: Bearer.
services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    command: ["gateway", "run"]
    ports:
      # Bound to localhost only — never expose this publicly. If Hermes runs
      # on its own separate host (the production recommendation), bind to
      # that host's private/VPC interface instead, still never 0.0.0.0 on a
      # publicly routable NIC.
      - "127.0.0.1:${HERMES_PORT:-8642}:8642"
    environment:
      API_SERVER_ENABLED: "true"
      # 0.0.0.0 is safe here specifically because it's *inside* the
      # container — the ports: line above is what controls host exposure.
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_KEY}
      API_SERVER_CORS_ORIGINS: "" # no browser client talks to this directly; leave CORS closed
      # The chosen inference provider's own credential — see
      # HERMES_SKILLS_AND_TOOLS.md's provider section. Not read or generated
      # by any StratExcel code; this is entirely internal to the Hermes
      # Agent process. Example shown for OpenRouter (recommended default);
      # swap for whichever provider env var is actually configured.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - hermes_data:/opt/data
    restart: unless-stopped

volumes:
  hermes_data:
