# Example nginx config for reaching a loopback-bound Hermes gateway from a
# private network only (docs/hermes/DEPLOYMENT.md). Not deployed by this
# branch. Fill in the private hostname/allowlist before using for real —
# see docs/hermes/MANUAL_REQUIREMENTS.md item 1 for the network-mechanism
# decision this assumes has already been made.

server {
    listen 443 ssl;
    # Private DNS name only — never a publicly resolvable hostname pointed
    # at this upstream without the network-layer restriction also in place.
    server_name hermes.internal.example;

    ssl_certificate     /etc/ssl/hermes-internal/fullchain.pem;
    ssl_certificate_key /etc/ssl/hermes-internal/privkey.pem;

    # Defense in depth on top of Hermes' own bearer-token requirement, not a
    # substitute for it — every request must still carry a valid
    # Authorization: Bearer header.
    allow 10.0.0.0/8;      # example: replace with the actual private CIDR
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;

        # SSE streams (GET /v1/runs/{run_id}/events) must not be buffered.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
