# Example only — not run by this branch. Loopback-bound by default; see
# docs/hermes/DEPLOYMENT.md for how this is reached from Stratxcel's Vercel
# deployment without ever binding this port publicly.
#
# Requires docker.sock mounted so Hermes' own `terminal.backend: docker` can
# spawn per-mission tool-call containers (docs/hermes/SECRETS_AND_SECURITY.md)
# — a second, nested layer of containerization from this gateway container.

services:
  hermes-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      # Bound to loopback only. A reverse proxy (see reverse-proxy.example.conf)
      # or private-network tunnel sits in front for real access — never widen
      # this to 0.0.0.0 directly.
      - "127.0.0.1:${API_SERVER_PORT:-8642}:8642"
    volumes:
      - hermes_home:/home/hermes/.hermes
      # Required for terminal.backend: docker (nested container spawning).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "curl -sf -H \"Authorization: Bearer ${API_SERVER_KEY}\" http://127.0.0.1:8642/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  hermes_home:
